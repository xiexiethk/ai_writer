services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "28000:28000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:28000/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - backend_data:/app/backend/data
      - backend_uploads:/app/backend/uploads
      - backend_parsed_output:/app/backend/parsed_output
      - openwps_data:/app/openwps_server/data
      - openwps_config:/app/openwps_server/config

volumes:
  backend_data:
  backend_uploads:
  backend_parsed_output:
  openwps_data:
  openwps_config:
